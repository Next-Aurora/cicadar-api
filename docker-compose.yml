# 统一 Stack：Portainer CI 与本地 docker compose 共用
# 镜像不写死在文件里：部署时用 Portainer 栈变量或 shell 传入
# - IMAGE_URI：完整镜像地址（CI 注入）
services:
  api:
    image: ${IMAGE_URI}
    container_name: cicadar-api
    # 公网：宿主机 Nginx api.cicadar.cn → 本机 8080（cicada 仓库 scripts/nginx/cicadar-api.conf）。
    # 该入口不转发 /internal/。站点容器走 host.docker.internal:8080。
    ports:
      - "${API_PORT:-127.0.0.1:8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Cicada=${CONNECTION_STRING:-}
      - InternalAuth__Token=${INTERNAL_AUTH_TOKEN:-}
    networks:
      - cicadar-api-network
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cicadar-api-network:
    name: cicadar-api-network
    driver: bridge
    external: false
